name: Validate NVIDIA model catalog

on:
  push:
    paths: ['data/**', 'scripts/**', 'README.md', '.github/workflows/**']
  pull_request:
    paths: ['data/**', 'scripts/**', 'README.md', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate data and generated files
        run: python scripts/validate_data.py
      - name: Compare with the live NVIDIA API (informational)
        # Upstream changes should not block unrelated pull requests; read this step's log for drift.
        continue-on-error: true
        run: python scripts/update_models.py --check
